openapi: 3.0.0
info:
  title: Taskamaster API
  version: 1.0.0
  description: API documentation for the Taskamaster application

servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /tasks:
    get:
      summary: Get all tasks for the logged-in user
      tags: [Tasks]
      responses:
        '200':
          description: A list of tasks
    post:
      summary: Create a new task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created

  /tasks/{id}:
    put:
      summary: Update a task
      tags: [Tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: Task updated
    delete:
      summary: Delete a task
      tags: [Tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted

components:
  schemas:
    Task:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        dueDate:
          type: string
          format: date
        priority:
          type: string
          enum: [Low, Medium, High, Urgent]
        completed:
          type: boolean
        category:
          type: string
        reminder:
          type: string
          format: date-time
        user:
          type: string
